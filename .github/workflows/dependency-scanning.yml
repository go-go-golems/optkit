name: Dependency Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday at midnight

jobs:
  dependency-review:
    # The action requires GitHub's repository-level dependency graph, which is
    # not enabled for this repository. Keep the advisory check visible without
    # making every PR permanently unmergeable until that setting is enabled.
    name: Dependency Review
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      
      - name: Install govulncheck
        # Pin a release supported by the Go version declared in go.mod.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      
      - name: Run govulncheck
        run: govulncheck ./...
        
  gosec:
    name: GoSec Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      
      - name: Install gosec
        # Pin a release supported by the Go version declared in go.mod.
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.21.4

      - name: Run Gosec Security Scanner
        run: gosec -exclude=G101,G304,G301,G306,G204 -exclude-dir=.history ./... 
