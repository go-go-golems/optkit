name: Dependency Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday at midnight

jobs:
  dependency-review:
    # The action requires GitHub's repository-level dependency graph, which is
    # not enabled for this repository. Keep the advisory check visible without
    # making every PR permanently unmergeable until that setting is enabled.
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dependency Review
        # The repository has no dependency graph yet, so this action cannot
        # produce a review. Do not block PRs until the setting is enabled.
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Scan against a current patched standard library, independent of
          # the project's minimum supported language version.
          go-version: stable

      - name: Install govulncheck
        # The stable scanner toolchain supports the maintained scanner.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    name: GoSec Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Scan against a current patched standard library, independent of
          # the project's minimum supported language version.
          go-version: stable

      - name: Install gosec
        # Pin a release supported by the stable scanner toolchain.
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run Gosec Security Scanner
        # CodeQL enforces unsafe integer conversions. Artifact files are
        # deliberately immutable and ticket helpers are not product packages.
        run: gosec -exclude=G101,G115,G302,G304,G301,G306,G204 -exclude-dir=.history -exclude-dir=ttmp ./...
