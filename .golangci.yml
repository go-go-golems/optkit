---
# This file contains the configuration for golangci-lint
# See https://golangci-lint.run/usage/configuration/ for reference

# Defines the configuration version.
# The only possible value is "2".
version: "2"

# Linters configuration
linters:
  # Default set of linters.
  default: none
  # Enable specific linters
  enable:
    # defaults
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # additional linters
    - exhaustive
    #    - gochecknoglobals
    #    - gochecknoinits
    - nonamedreturns
    - predeclared
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Tests use deferred cleanup for local temporary stores. Cleanup failure
      # cannot affect the assertion outcome and is covered by filesystem reset.
      - path: _test\.go
        linters:
          - errcheck

# Formatters configuration
formatters:
  enable:
    - gofmt
